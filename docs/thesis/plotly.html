<!-- The web edition's figures: each embedded spec (the plotly shortcode) drawn by Plotly; a point
     with a link (a survey design's DOI) opens it on click. -->
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js" charset="utf-8"></script>
<script>
  (function () {
    function draw() {
      document.querySelectorAll("script.plotly-spec").forEach(function (source) {
        var target = document.getElementById(source.dataset.target);
        if (!target || target.dataset.drawn) return;
        var spec = JSON.parse(source.textContent);
        target.dataset.drawn = "1";
        Plotly.newPlot(target, spec.data, spec.layout, spec.config).then(function () {
          target.on("plotly_click", function (event) {
            var url = event.points.length && event.points[0].customdata;
            if (typeof url === "string" && url) window.open(url, "_blank", "noopener");
          });
        });
      });
    }
    // Plotly measures text with the page's fonts: draw once they are ready
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(draw);
  })();
</script>
