<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>$pagetitle$</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono&amp;display=swap">
<style>
/* A thesis set for the screen: the PDF's Latin Modern on white, one justified column of about
   70 characters, numbered contents at the left, side notes in the right margin. One light look
   on purpose: the figures are drawn on white, as printed. */
@font-face { font-family: "Latin Modern Roman"; src: url("fonts/LM-regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Latin Modern Roman"; src: url("fonts/LM-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Latin Modern Roman"; src: url("fonts/LM-bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: "Latin Modern Roman"; src: url("fonts/LM-bold-italic.woff2") format("woff2"); font-weight: 700; font-style: italic; font-display: swap; }

:root {
  /* layout: one text column, growing with the window up to --measure; figures exactly its width;
     a margin column for side notes on wide screens; contents behind a button */
  --paper: #ffffff;
  --ink: #141414;
  --muted: #555a63;
  --rule: #c9ced6;
  --link: #1d4f91;
  --tint: #f3f5f8;
  --serif: "Latin Modern Roman", "DejaVu Serif", Georgia, "Times New Roman", serif;
  --measure: 45rem; /* 720 px at the 16 px rem: 87 characters of 19 px Latin Modern, the line of the A4 thesis (KOMA 11pt, DIV=12: 157.5 mm) */
  --note: 14rem;
  color-scheme: light;
}
html { background: var(--paper); }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.45;
  font-kerning: normal;
  font-feature-settings: "kern", "liga";
  margin: 0;
}
.page {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  justify-content: center;
  gap: 0 3rem;
  padding-block: 2.5rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { grid-template-columns: minmax(0, var(--measure)); }
@media (min-width: 1300px) {
  .page { grid-template-columns: minmax(0, var(--measure)) var(--note); }
  main .aside { float: right; clear: right; width: var(--note); margin: 0.2rem calc(-1 * (var(--note) + 3rem)) 1rem 0; border-left: none; padding-left: 0; }
}
main { min-width: 0; width: 100%; max-width: var(--measure); }

/* title block, as a thesis's title page in miniature */
.titleblock { margin-bottom: 2.5rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--rule); }
.titleblock h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 0.6rem; text-wrap: balance; }
.titleblock .subtitle { font-style: italic; margin: 0 0 1rem; }
.titleblock .meta { font-variant: small-caps; letter-spacing: 0.04em; color: var(--muted); margin: 0; }

/* contents: a button at the top left opening the list as a panel */
.toc-toggle {
  position: fixed; z-index: 20;
  top: calc(0.8rem + env(safe-area-inset-top, 0px)); left: calc(0.8rem + env(safe-area-inset-left, 0px));
  font: inherit; font-size: 0.82rem; font-variant: small-caps; letter-spacing: 0.06em;
  color: var(--muted); background: var(--paper); border: 1px solid var(--rule); padding: 0.25rem 0.7rem; cursor: pointer;
}
.toc-toggle:hover, .toc-toggle:focus-visible { color: var(--ink); border-color: var(--muted); }
.contents {
  position: fixed; z-index: 19;
  top: calc(2.9rem + env(safe-area-inset-top, 0px)); left: calc(0.8rem + env(safe-area-inset-left, 0px));
  width: min(19rem, calc(100vw - 1.6rem)); max-height: calc(100vh - 4rem); overflow-y: auto;
  background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 6px 24px rgba(20, 20, 20, 0.12);
  padding: 0.8rem 1rem 0.8rem 0.6rem; font-size: 0.86rem; line-height: 1.35;
}
.contents.folded { display: none; }
/* each entry a two-column grid: its number in a fixed column, the title (wrapped lines too) beside
   it; every level indented by one number column */
.contents ul { list-style: none; margin: 0; padding: 0; }
.contents ul ul { padding-left: 1.7rem; }
.contents li { margin: 0.2rem 0; }
.contents > ul > li { margin-top: 0.65rem; }
.contents a {
  display: grid; grid-template-columns: 1.7rem minmax(0, 1fr); align-items: baseline;
  color: var(--ink); text-decoration: none;
  padding: 0.05rem 0 0.05rem 0.45rem; border-left: 2px solid transparent;
}
.contents ul ul ul a { grid-template-columns: minmax(0, 1fr); }
.contents a:hover, .contents a:focus-visible { color: var(--link); }
.contents a.active { color: var(--link); border-left-color: var(--link); }
.contents .num { color: var(--muted); font-variant-numeric: tabular-nums; }
.contents ul ul .num { grid-column: 1; }

/* text */
main p, main li { text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
main h1 { font-size: 1.75rem; line-height: 1.2; margin: 3rem 0 1.2rem; text-wrap: balance; }
main h2 { font-size: 1.3rem; line-height: 1.25; margin: 2.2rem 0 0.7rem; text-wrap: balance; }
main h3 { font-size: 1.08rem; margin: 1.6rem 0 0.5rem; }
main h1 .num, main h2 .num { margin-right: 0.6em; }
main section:first-of-type > h1 { margin-top: 0; }
p { margin: 0 0 0.9rem; }
a { color: var(--link); text-underline-offset: 0.15em; text-decoration-thickness: 1px; }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
a.xref, .citation a { text-decoration: none; }
a.xref:hover, .citation a:hover { text-decoration: underline; }
code { font-size: 0.9em; background: var(--tint); padding: 0 0.2em; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 0.2rem 0; }

/* figures: the plot on white, the caption small, set like LaTeX's */
.figure { margin: 1.8rem 0 2rem; clear: both; }
.figure .plot { width: 100%; min-height: 320px; }
.figure > p { font-size: 0.86rem; line-height: 1.38; margin: 0.4rem 0 0; }
.figlabel { margin-right: 0.15em; }
/* Inkscape drawings, inline so that their labels take Noto Sans Mono as in Inkscape */
.panels { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 0.8rem 1.2rem; align-items: end; }
@media (max-width: 600px) { .panels { grid-template-columns: repeat(min(var(--cols, 1), 2), minmax(0, 1fr)); } }
.drawing-svg { display: block; width: 100%; height: auto; }
.drawing-svg text, .drawing-svg tspan { font-family: "Noto Sans Mono", "DejaVu Sans Mono", monospace; }
.panel-label { text-align: center !important; font-size: 0.86rem; margin: 0.2rem 0 0; }
.picked { font-size: 0.82rem; color: var(--muted); text-align: left !important; margin: 0.3rem 0 0; }

/* side notes: in the margin column when there is one, else set off in the text */
.aside { font-size: 0.8rem; line-height: 1.35; color: var(--muted); border-left: 2px solid var(--rule); padding-left: 0.8rem; margin: 0.4rem 0 1rem; }
.aside p { text-align: left; margin: 0 0 0.4rem; }

/* tables as booktabs: rules above, below and under the header only */
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; line-height: 1.3; margin: 1.4rem 0 1.8rem; }
caption { caption-side: top; text-align: left; margin-bottom: 0.5rem; }
thead th { border-top: 1.5px solid var(--ink); border-bottom: 0.8px solid var(--ink); text-align: left; padding: 0.35rem 0.6rem 0.35rem 0; }
tbody tr:last-child td { border-bottom: 1.5px solid var(--ink); }
td { padding: 0.3rem 0.6rem 0.3rem 0; vertical-align: top; text-align: left !important; }
.table-wrap { overflow-x: auto; }

/* the draft's open items */
.openitems { background: var(--tint); border-left: 3px solid var(--rule); padding: 0.8rem 1rem 0.4rem; margin: 2rem 0; font-size: 0.88rem; }
.openitems p, .openitems li { text-align: left; }
.openitems ul { padding-left: 1.2rem; margin: 0.4rem 0 0.6rem; }

/* references, IEEE style */
#refs { font-size: 0.88rem; line-height: 1.35; }
.csl-entry { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); margin-bottom: 0.45rem; }
.csl-left-margin { color: var(--muted); }
.csl-right-inline, .csl-entry { text-align: left; overflow-wrap: anywhere; }

@media (max-width: 600px) { body { font-size: 17px; } main p, main li { text-align: left; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
html { scroll-behavior: smooth; }
</style>
<script>
  window.MathJax = { tex: { tags: "none" }, svg: { fontCache: "global" } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js" charset="utf-8"></script>
</head>
<body>
<div class="page">
<button class="toc-toggle" type="button" id="toc-toggle" aria-expanded="false" aria-controls="contents">Contents</button>
<nav class="contents folded" id="contents" aria-label="Contents">
$table-of-contents$
</nav>
<main>
<header class="titleblock">
<h1>$title$</h1>
$if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
<p class="meta">$for(author)$$author$$sep$, $endfor$ · $date$</p>
</header>
$body$
</main>
</div>
<script>
  // each embedded figure spec drawn by Plotly once the fonts are in; a survey point's paper
  // linked under its figure when the point is clicked
  (function () {
    function draw() {
      document.querySelectorAll("script.plotly-spec").forEach(function (source) {
        var target = document.getElementById(source.dataset.target);
        if (!target || target.dataset.drawn) return;
        var spec = JSON.parse(source.textContent);
        target.dataset.drawn = "1";
        Plotly.newPlot(target, spec.data, spec.layout, spec.config).then(function () {
          var picked = document.getElementById(target.id.replace("plot-", "picked-"));
          target.on("plotly_click", function (event) {
            var point = event.points.length ? event.points[0] : null;
            var url = point && point.customdata;
            if (!picked || typeof url !== "string" || !url) return;
            var title = String(point.text || "").split("</b>")[0].replace(/<br>/g, " ").replace(/<[^>]+>/g, "");
            picked.textContent = "Selected: " + title + " — ";
            var link = document.createElement("a");
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = url.replace("https://doi.org/", "doi:");
            picked.appendChild(link);
            picked.hidden = false;
          });
        });
      });
    }
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(draw);
  })();

  // the contents: folded behind a button on phones, and the heading being read marked
  (function () {
    var nav = document.querySelector(".contents");
    var toggle = document.getElementById("toc-toggle");
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !nav.classList.contains("folded")) { nav.classList.add("folded"); toggle.setAttribute("aria-expanded", "false"); toggle.focus(); }
    });
    toggle.addEventListener("click", function () {
      var folded = nav.classList.toggle("folded");
      toggle.setAttribute("aria-expanded", String(!folded));
    });
    nav.addEventListener("click", function (event) {
      if (event.target.closest("a")) {
        nav.classList.add("folded");
        toggle.setAttribute("aria-expanded", "false");
      }
    });
    var links = {};
    nav.querySelectorAll("a[href^='#']").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
    var headings = Array.prototype.filter.call(document.querySelectorAll("main h1[id], main h2[id], main section[id] > h1, main section[id] > h2"), function (h) {
      return links[h.id || h.parentElement.id];
    });
    function mark() {
      var current = null;
      headings.forEach(function (h) { if (h.getBoundingClientRect().top < 120) current = h.id || h.parentElement.id; });
      if (!current && headings.length) current = headings[0].id || headings[0].parentElement.id;
      Object.keys(links).forEach(function (id) { links[id].classList.toggle("active", id === current); });
    }
    window.addEventListener("scroll", mark, { passive: true });
    mark();
  })();
</script>
</body>
</html>
