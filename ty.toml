[environment]
python-version = "3.12"
# Resolve editable first-party dependencies without relying on executable .pth
# files, which static analyzers intentionally do not import.
root = [
    ".",
    "libs/basil",
    "libs/Hdl21",
    "libs/Vlsir/VlsirTools",
    "libs/Vlsir/bindings/python",
]

[src]
exclude = ["libs/", ".venv/"]

# Suppress rules that mostly fire on library metaprogramming / incomplete
# type stubs (hdl21, pydantic, numpy, matplotlib). Re-enable as ty matures.
[rules]
unknown-argument = "ignore"
unresolved-import = "ignore"
unresolved-attribute = "ignore"
call-non-callable = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"
not-subscriptable = "ignore"
invalid-type-form = "ignore"
invalid-argument-type = "error"
too-many-positional-arguments = "ignore"
# hdl21 generator/param patterns
invalid-return-type = "ignore"
invalid-parameter-default = "ignore"
not-iterable = "ignore"
invalid-assignment = "ignore"
# Require explicit type arguments for generic containers in first-party code.
missing-type-argument = "error"
