[project]
name = "frida"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core
    "numpy",
    "scipy",
    "matplotlib>=3.11,<3.12",
    "openpyxl",
    "pillow",
    "h5py",
    "pyyaml",
    "pydantic",
    "pytest",
    "klayout",
    "protobuf",
    # Keep these commits aligned with the submodule gitlinks; uv uses the local editable sources below.
    "hdl21 @ git+https://github.com/kcaisley/Hdl21.git@c0d73fa152c1b290498dfd686d10db597567e9af",
    "vlsir @ git+https://github.com/kcaisley/Vlsir.git@21d2981b171046c5f03dcc2f1307854cbd054516#subdirectory=bindings/python",
    "vlsirtools @ git+https://github.com/kcaisley/Vlsir.git@21d2981b171046c5f03dcc2f1307854cbd054516#subdirectory=VlsirTools",
    "basil-daq @ git+https://github.com/SiLab-Bonn/basil.git@c1a011edee2d8ede0811f1246e182a7e93f518e7",
    "cocotb",
    "cocotb-bus",
    "spyci",
    "vcdvcd",
    "pexpect",
    "gitpython",
    "setuptools",  # basil imports pkg_resources at runtime
    "bitarray",
    "pyvisa",
    "pyvisa-py",
    "gpib-ctypes",
    "pyserial",
    "pyusb>=1.3.1",
    "ruff>=0.16.1",
    "pre-commit>=4.6.2",
    "optuna>=4.0",
]

[dependency-groups]
dev = [
    "ty==0.0.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["flow", "pdk"]

[tool.uv]
package = true

[tool.uv.sources]
hdl21 = { path = "libs/Hdl21", editable = true }
vlsir = { path = "libs/Vlsir/bindings/python", editable = true }
vlsirtools = { path = "libs/Vlsir/VlsirTools", editable = true }
basil-daq = { path = "libs/basil", editable = true }

[tool.pyright]
# Keep a single pyright config here. Zed uses basedpyright for Python,
# and basedpyright reads [tool.pyright] too.
typeCheckingMode = "off"
# ROOT (PyROOT) is built from source at ~/libs/root/ (C++17, no pip package).
# Add its Python bindings path so the type checker can resolve `import ROOT`.
extraPaths = ["libs/Hdl21", "libs/Vlsir/VlsirTools", "libs/Vlsir/bindings/python", "libs/basil", "../libs/root/lib"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "**/libs/basil",
]

[tool.ruff]
line-length = 120
exclude = ["libs/basil"]

[tool.ruff.lint]
ignore = ["E741"]  # Allow 'l' for transistor length
extend-select = ["ICN003"]

[tool.ruff.lint.flake8-import-conventions]
# a block on the pipeline is reached by its namespace: `from flow import comp` then `comp.Params`
# (docs/pipeline.md); inside the block its stages import each other relatively
banned-from = [
    "flow.comp",
    "flow.comp.params",
    "flow.comp.subckt",
    "flow.comp.sim",
    "flow.comp.types",
    "flow.comp.analysis",
    "flow.comp.plots",
    "flow.comp.sweep",
    "flow.samp",
    "flow.samp.params",
    "flow.samp.subckt",
    "flow.samp.sim",
    "flow.samp.types",
    "flow.samp.analysis",
    "flow.samp.plots",
    "flow.samp.sweep",
    "flow.cdac",
    "flow.cdac.params",
    "flow.cdac.subckt",
    "flow.cdac.sim",
    "flow.cdac.types",
    "flow.cdac.analysis",
    "flow.cdac.plots",
    "flow.cdac.sweep",
]

[tool.ruff.lint.isort]
# PDK submodules are intentionally absent from the public Ruff CI checkout.
known-first-party = ["flow", "pdk"]

[tool.ruff.lint.per-file-ignores]
"flow/adc/behavioral.py" = ["F841", "F401"]
"pdk/**" = ["F401", "F403", "F405"]

[tool.importlinter]
# the pipeline's stage order (docs/pipeline.md), for each block on it (flow/test_pipeline.py: MIGRATED);
# run as `PYTHONPATH=. uvx --from import-linter==2.15 lint-imports` (pre-commit and CI)
root_packages = ["flow"]

[[tool.importlinter.contracts]]
name = "comp: each stage imports only the stages below it"
type = "layers"
containers = ["flow.comp"]
layers = ["model", "sweep", "plots", "analysis", "types", "sim | layout", "subckt", "params"]

[[tool.importlinter.contracts]]
name = "samp: each stage imports only the stages below it"
type = "layers"
containers = ["flow.samp"]
layers = ["model", "sweep", "plots", "analysis", "types", "sim | layout", "subckt", "params"]

[[tool.importlinter.contracts]]
name = "cdac: each stage imports only the stages below it"
type = "layers"
containers = ["flow.cdac"]
layers = ["model", "sweep", "plots", "analysis", "types", "sim", "subckt", "params"]

[[tool.importlinter.contracts]]
name = "the pipeline's base knows no block"
type = "forbidden"
source_modules = ["flow.pipeline"]
forbidden_modules = ["flow.comp", "flow.samp", "flow.adc", "flow.cdac", "flow.caparray", "flow.sweep"]

[tool.pytest.ini_options]
testpaths = ["flow", "pdk", "test"]
python_files = ["test_*.py", "test.py", "layout.py"]
addopts = "-m 'not hw and not site_pdk and not spectre'"
markers = [
    "spectre: opt-in short Spectre diagnostics using actual simulation targets",
    "hw: requires physical FPGA or laboratory hardware (deselected by default)",
    "slow: long-running characterization or regression campaign",
    "site_pdk: requires site-local PDK installations under /eda/kits (deselected by default)",
]
# Suppress protobuf deprecation warning from vlsirtools dependency.
# The warning is about Python 3.14 C API changes in google._upb._message.
# Vlsir pins protobuf~=4.23 (in libs/Vlsir/bindings/python/setup.py),
# which prevents upgrading to protobuf 5.x/6.x where this may be fixed.
filterwarnings = [
    "ignore:Type google._upb._message:DeprecationWarning",
]
