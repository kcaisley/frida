[project]
name = "frida"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core
    "numpy",
    "scipy",
    "matplotlib>=3.11,<3.12",
    "openpyxl",
    "pillow",
    "h5py",
    "pyyaml",
    "pydantic",
    "pytest",
    "klayout",
    "protobuf",
    "tabulate",  # the step runner's table (python -m flow)
    # Keep these commits aligned with the submodule gitlinks; uv uses the local editable sources below.
    "hdl21 @ git+https://github.com/kcaisley/Hdl21.git@c0d73fa152c1b290498dfd686d10db597567e9af",
    "vlsir @ git+https://github.com/kcaisley/Vlsir.git@21d2981b171046c5f03dcc2f1307854cbd054516#subdirectory=bindings/python",
    "vlsirtools @ git+https://github.com/kcaisley/Vlsir.git@21d2981b171046c5f03dcc2f1307854cbd054516#subdirectory=VlsirTools",
    "basil-daq @ git+https://github.com/SiLab-Bonn/basil.git@c1a011edee2d8ede0811f1246e182a7e93f518e7",
    "cocotb",
    "cocotb-bus",
    "spyci",
    "vcdvcd",
    "pexpect",
    "gitpython",
    "setuptools",  # basil imports pkg_resources at runtime
    "bitarray",
    "pyvisa",
    "pyvisa-py",
    "gpib-ctypes",
    "pyserial",
    "pyusb>=1.3.1",
    "ruff>=0.16.1",
    "pre-commit>=4.6.2",
    "optuna>=4.0",
]

[dependency-groups]
dev = [
    "ty==0.0.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["flow", "pdk"]

[tool.uv]
package = true

[tool.uv.sources]
hdl21 = { path = "libs/Hdl21", editable = true }
vlsir = { path = "libs/Vlsir/bindings/python", editable = true }
vlsirtools = { path = "libs/Vlsir/VlsirTools", editable = true }
basil-daq = { path = "libs/basil", editable = true }

[tool.pyright]
# Keep a single pyright config here. Zed uses basedpyright for Python,
# and basedpyright reads [tool.pyright] too.
typeCheckingMode = "recommended"
# Scan only first-party code. libs/* stays importable via extraPaths;
# build/ and docs/ are never walked, which keeps remote (Zed SSH) startup fast.
include = ["flow", "pdk", "test", "design", "phys"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]

[tool.ty.environment]
python-version = "3.12"
# Resolve editable first-party dependencies without relying on executable .pth
# files, which static analyzers intentionally do not import.
root = [
    ".",
    "libs/basil",
    "libs/Hdl21",
    "libs/Vlsir/VlsirTools",
    "libs/Vlsir/bindings/python",
]

[tool.ty.src]
exclude = ["libs/", ".venv/"]

# Some developer environments intentionally omit optional simulation dependencies.
# Keep imports permissive while enforcing every other ty diagnostic.
[tool.ty.rules]
unresolved-import = "ignore"
invalid-argument-type = "error"
# Require explicit type arguments for generic containers in first-party code.
missing-type-argument = "error"

# HDL21 builds parameter classes, modules, and primitive-call APIs dynamically.
# Ty cannot currently model those runtime decorators, so treat only HDL21 as an
# untyped external boundary inside the flow directories covered by the hook
# and their shared circuit-construction layer.
[[tool.ty.overrides]]
include = [
    "flow/analysis/**",
    "flow/scans/**",
    "flow/adc/**",
    "flow/comp/**",
    "flow/samp/**",
    "flow/capdac/**",
    "flow/layout/devices/**",
    "flow/layout/hdl21align/**",
    "flow/layout/test_hdl21align.py",
    "flow/circuit/**",
]

[tool.ty.overrides.analysis]
replace-imports-with-any = ["hdl21.**"]

[tool.ruff]
line-length = 120
exclude = ["libs/basil"]

[tool.ruff.lint]
ignore = ["E741"]  # Allow 'l' for transistor length
extend-select = ["ICN003"]

[tool.ruff.lint.flake8-import-conventions]
# a block on the pipeline is reached by its namespace: `from flow import comp` then `comp.Params`
# (docs/pipeline.md); inside the block its stages import each other relatively
banned-from = [
    "flow.comp",
    "flow.comp.params",
    "flow.comp.subckt",
    "flow.comp.sim",
    "flow.comp.types",
    "flow.comp.analysis",
    "flow.comp.plots",
    "flow.comp.sweep",
    "flow.samp",
    "flow.samp.params",
    "flow.samp.subckt",
    "flow.samp.sim",
    "flow.samp.types",
    "flow.samp.analysis",
    "flow.samp.plots",
    "flow.samp.sweep",
    "flow.capdac",
    "flow.capdac.params",
    "flow.capdac.subckt",
    "flow.capdac.sim",
    "flow.capdac.types",
    "flow.capdac.analysis",
    "flow.capdac.plots",
    "flow.capdac.sweep",
]

[tool.ruff.lint.isort]
# PDK submodules are intentionally absent from the public Ruff CI checkout.
known-first-party = ["flow", "pdk"]

[tool.ruff.lint.per-file-ignores]
"pdk/**" = ["F401", "F403", "F405"]

[tool.importlinter]
# the pipeline's stage order (docs/pipeline.md), for each block on it (flow/test_pipeline.py: MIGRATED);
# run as `PYTHONPATH=. uvx --from import-linter==2.15 lint-imports` (pre-commit and CI)
root_packages = ["flow"]
# an import for a type annotation alone (under typing.TYPE_CHECKING) is no dependency at run time
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
# every migrated block (flow/test_pipeline.py holds the containers to them); a layer in parentheses
# is a file a block may not have; model and layout side by side at the top, neither importing
# another, and none imported by a stage
name = "each block's stages import only the stages below them"
type = "layers"
containers = ["flow.adc", "flow.capdac", "flow.comp", "flow.samp"]
layers = ["model | (layout)", "runs", "plots", "analysis", "types", "sim", "subckt", "params"]

[[tool.importlinter.contracts]]
name = "the pipeline's base knows no block"
type = "forbidden"
source_modules = ["flow.pipeline"]
forbidden_modules = ["flow.comp", "flow.samp", "flow.adc", "flow.capdac", "flow.sweep"]

[[tool.importlinter.contracts]]
# the circuit helpers every block's sim uses, and the measurement files' reader and writer: the ADC's
# raw decode is its own sim's (flow/adc/sim.py), its weights from a capacitance table its search's
name = "the shared circuit and measurement I/O know no ADC"
type = "forbidden"
source_modules = ["flow.circuit", "flow.analysis.io"]
forbidden_modules = ["flow.adc"]

[tool.pytest.ini_options]
testpaths = ["flow", "pdk", "test"]
python_files = ["test_*.py", "test.py", "layout.py"]
addopts = "-m 'not hw and not site_pdk and not spectre'"
markers = [
    "spectre: opt-in short Spectre diagnostics using actual simulation targets",
    "hw: requires physical FPGA or laboratory hardware (deselected by default)",
    "slow: long-running characterization or regression campaign",
    "site_pdk: requires site-local PDK installations under /eda/kits (deselected by default)",
]
# Suppress protobuf deprecation warning from vlsirtools dependency.
# The warning is about Python 3.14 C API changes in google._upb._message.
# Vlsir pins protobuf~=4.23 (in libs/Vlsir/bindings/python/setup.py),
# which prevents upgrading to protobuf 5.x/6.x where this may be fixed.
filterwarnings = [
    "ignore:Type google._upb._message:DeprecationWarning",
]
