name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out FRIDA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out Python and HDL dependencies
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 libs/Hdl21 libs/Vlsir libs/basil

      - name: Install system linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes chktex verilator

      - name: Install Verible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo chipsalliance/verible \
            --pattern '*linux-static-x86_64.tar.gz' \
            --output /tmp/verible.tar.gz
          mkdir /tmp/verible
          tar -xzf /tmp/verible.tar.gz -C /tmp/verible
          sudo find /tmp/verible -type f -path '*/bin/verible-*' \
            -exec install -m 0755 {} /usr/local/bin/ \;

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: 3.12.11
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run all pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  pytest:
    name: Pytest (software)
    runs-on: ubuntu-latest
    steps:
      - name: Check out FRIDA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out Python and HDL dependencies
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 libs/Hdl21 libs/Vlsir libs/basil

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: 3.12.11
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run software tests
        run: uv run pytest -m 'not hw and not site_pdk'
