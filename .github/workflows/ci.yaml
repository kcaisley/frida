name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out FRIDA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: 3.12.11
          enable-cache: true

      - name: Install mdl
        run: |
          gem install mdl --version 0.14.0 --no-document --user-install
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Run rumdl
        run: uvx --from rumdl==0.2.55 rumdl check $(git ls-files '*.md')

      - name: Run mdl
        if: ${{ always() }}
        run: mdl $(git ls-files '*.md')

  ty:
    name: Ty (PDK-independent)
    runs-on: ubuntu-latest
    steps:
      - name: Check out FRIDA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out Python and HDL dependencies
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 libs/Hdl21 libs/Vlsir libs/basil

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: 3.12.11
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run Ty
        run: >-
          uv run ty check
          flow/adc/subckt.py
          flow/opt/runner.py
          flow/pipeline.py
          flow/plot.py
          flow/scans/plldrp.py
          $(uv run python -c "from flow.test_pipeline import typed; print(*typed())")

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out FRIDA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: 3.12.11
          enable-cache: true

      - name: Run Ruff lint
        run: uvx pre-commit run ruff-lint --all-files --show-diff-on-failure

      - name: Run Ruff format
        if: ${{ always() }}
        run: uvx pre-commit run ruff-format --all-files --show-diff-on-failure

      - name: Check the block pipeline's stage order
        if: ${{ always() }}
        run: PYTHONPATH=. uvx --from import-linter==2.15 lint-imports

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out FRIDA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out Python and HDL dependencies
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 libs/Hdl21 libs/Vlsir libs/basil

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: 3.12.11
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run PDK-independent tests
        run: >-
          uv run pytest
          flow/adc/test_behavioral.py
          flow/adc/test_reference.py
          flow/adc/test_subckt.py
          flow/comp/test_subckt.py
          flow/comp/test_layout.py
          flow/test_netlists.py
          flow/opt/test_runner.py
          flow/layout/test_floorplan.py
          flow/layout/test_lint.py
          flow/layout/test_mosline.py
          flow/layout/test_pdkproc.py
          flow/layout/test_signoff.py
          flow/layout/test_stdcells.py
          test/test_pdk_agnostic.py
          flow/samp/test_subckt.py
          flow/comp/test_sim.py
          flow/comp/test_analysis.py
          flow/comp/test_plots.py
          flow/test_pipeline.py
          flow/test_plot.py
          flow/samp/test_sim.py
          flow/samp/test_analysis.py
          flow/samp/test_plots.py
          flow/samp/test_layout.py
          flow/caparray/test_sim.py
          flow/caparray/test_sizing.py
          flow/cdac/test_analysis.py
          flow/cdac/test_model.py
          flow/cdac/test_sim.py
          flow/cdac/test_subckt.py
          flow/capdriver/test_model.py
          flow/adc/test_statistics.py
          flow/capdriver/test_subckt.py
          flow/circuit/test_sim.py
          flow/circuit/test_remote.py
          flow/circuit/test_spectre.py
          flow/scans/test_plldrp.py
          test/test_hooks.py
          test/test_adc_capdriver.py
          test/test_salogic.py
          test/test_spi_register.py
