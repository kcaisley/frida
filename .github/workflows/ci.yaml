name: CI

# Every job runs one check of tools/check.py, the same command a checkout and a local runner
# run. The native tools (Verible, OSS CAD Suite, tex-fmt) are pinned releases installed into
# FRIDA_TOOLS: build/tools here, cached on GitHub's runners; a self-hosted runner sets
# FRIDA_TOOLS in its environment to a persistent directory and skips the cache. No apt.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECK: uv run --no-project --python 3.12 python tools/check.py

jobs:
  python:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, import-linter, markdown]
    steps:
      - name: Check out FRIDA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Run ${{ matrix.check }}
        run: $CHECK ${{ matrix.check }}

  ty:
    name: ty
    runs-on: ubuntu-latest
    steps:
      - name: Check out FRIDA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Check out Python and HDL dependencies
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 libs/Hdl21 libs/Vlsir libs/basil

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run ty
        run: $CHECK ty

  # The four HDL checks, each its own job so a failure shows on its own.
  hdl:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [verible-format, verible-lint, verilator-lint, slang-lint]
    steps:
      - name: Check out FRIDA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Check out Basil (its firmware modules are in FRIDA's designs)
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 libs/basil

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Name the pinned tools
        id: tools
        run: echo "key=$($CHECK cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned tools
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/tools
          key: ${{ steps.tools.outputs.key }}

      - name: Install the pinned tools (where not yet installed)
        run: $CHECK install

      - name: Run ${{ matrix.check }}
        run: $CHECK ${{ matrix.check }}

  # The oldest Python FRIDA supports and the newest its dependencies' wheels support (3.15 waits on
  # h5py's and Cocotb's).
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Check out FRIDA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Check out Python and HDL dependencies
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 libs/Hdl21 libs/Vlsir libs/basil

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Name the pinned tools
        id: tools
        run: echo "key=$($CHECK cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned tools
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/tools
          key: ${{ steps.tools.outputs.key }}

      - name: Install the pinned tools (where not yet installed)
        run: $CHECK install

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run the PDK-independent tests (with OSS CAD Suite's Icarus for Cocotb)
        run: $CHECK pytest
