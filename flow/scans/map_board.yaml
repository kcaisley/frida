        - build/loopback_diffamp/summary_20260804_050103.csv
        - build/loopback_diffamp/summary_20260804_050351.csv
      vin_cm_supply_offset_v: -0.01869217609031749
      vin_cm_supply_gain: 0.9993280269186272

    # Manually accepted comparator S-curve calibrations at Vin_cm = 0.8 V.
    # Each source glob is relative to the repository root and includes all
    # coarse/fine trials used by the voltage-ordered Wilson analysis.
    comparator_calibration:
      0:
        offset_v: 0.011375641025641026
        noise_sigma_v: 0.0004679058486319688
        vin_cm_v: 0.8
        accepted_at_utc: "2026-08-04T04:25:19Z"
        source_hdf5_globs:
          - build/scan_comp/20260804_051653/*adc00*.h5
      1:
        offset_v: 0.00985263157894737
        noise_sigma_v: 0.00044458202336662815
        vin_cm_v: 0.8
        accepted_at_utc: "2026-08-04T04:25:19Z"
        source_hdf5_globs:
          - build/scan_comp/20260804_053759/*adc01*.h5
      2:
        offset_v: 0.010177570093457944
        noise_sigma_v: 0.00046171819651938664
        vin_cm_v: 0.8
        accepted_at_utc: "2026-08-04T04:25:19Z"
        source_hdf5_globs:
          - build/scan_comp/20260804_051653/*adc02*.h5
      3:
        offset_v: 0.01196334830878979
        noise_sigma_v: 0.0003614842917818984
        vin_cm_v: 0.8
        accepted_at_utc: "2026-08-04T04:25:19Z"
        source_hdf5_globs:
          - build/scan_comp/20260804_054953/*adc03*.h5

    # Manually accepted, acquisition-planning-only scale between the PEX CDAC
    # step and the direction-averaged measured C0 step. These values center
    # later adaptive sweeps; measured per-curve P50 values, never these scales,
    # drive capacitance extraction. List order is dac_diffcaps = 0, 1, i.e.
    # fabricated main+diff followed by normal main-diff operation.
    cdac_sweep_center_calibration:
      0:
        scale_by_diffcaps: [0.8230766558822209, 0.8087373278916857]
        accepted_at_utc: "2026-08-04T11:22:00+02:00"
        source_hdf5_globs:
          - build/scan_cdac/20260804_103656/*adc00*.h5
      2:
        scale_by_diffcaps: [1.061691094905829, 1.041627104743899]
        accepted_at_utc: "2026-08-04T10:36:00+02:00"
        source_hdf5_globs:
          - build/scan_cdac/20260804_100358/*adc02*.h5
          - build/scan_cdac/20260804_101107/*adc02*.h5

    # Exact sequence/baud settings characterized with the installed two-stage
    # delay bitstream, checked on ADC00-15 with 10,000 conversions per point.
    # One scope conversion per point agreed with all 17 FastRX bits.
    # Evidence: build/diagnostics/fastrx_capture_validation/accepted_summary.json
    # Installed: frida_comp_delay2_optimized.bit (2026-09-18).
    # Each entry: sequence (full catalogue name), symbol_rate_bps,
    # comp_delay_taps (0..62), rx_sen_start_word (word index).
    fastrx_capture_settings:
      - sequence: symbol160_init4_samp20_comp11111100_logic11000011
        symbol_rate_bps: 320000000
        comp_delay_taps: 16
        rx_sen_start_word: 5
      - sequence: symbol160_init4_samp20_comp11111100_logic11000011
        symbol_rate_bps: 960000000
        comp_delay_taps: 40
        rx_sen_start_word: 7
      - sequence: symbol160_init4_samp20_comp11111100_logic11000011
        symbol_rate_bps: 1600000000
        comp_delay_taps: 12
        rx_sen_start_word: 8
      - sequence: symbol256_init8_samp16_comp11110000_logic11000011
        symbol_rate_bps: 320000000
        comp_delay_taps: 31
        rx_sen_start_word: 6
      - sequence: symbol256_init8_samp16_comp11110000_logic11000011
        symbol_rate_bps: 960000000
        comp_delay_taps: 12
        rx_sen_start_word: 7
      - sequence: symbol256_init8_samp16_comp11110000_logic11000011
        symbol_rate_bps: 1600000000
        comp_delay_taps: 36
        rx_sen_start_word: 9
    # Scope decode only: midpoint of characterized 3.5..6.9 ns COMP-to-COMP_OUT
    # link latency. Sample halfway through the delayed decision, not at 7/8
    # of the undelayed COMP period (which is too early at 1.6 GBd).
    scope_comp_out_delay_s: 5.2e-9
