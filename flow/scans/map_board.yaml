        - -0.08902810328509066
        - -0.18426842070965369
        - 0.14648967748494326
      awg_center_coefficients:
        - -0.03671447340052964
        - 0.00556246917793871
        - 0.013122955541807379
        - -0.046240861278647245
        - 0.043549676159792335
        - -0.09666518112842887
      polynomial_source_summaries:
