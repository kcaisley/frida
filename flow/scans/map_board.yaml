# Physical FRIDA board inventory and empirical scan calibration.
#
# Unlike the Basil map_*.yaml files, this file does not describe a transport
# or register interface. It maps the board_id stored in AdcTbParams to the
# silicon variants, fixed board conditions, measured external-stimulus
# calibration, and comparator timing model needed by the physical scan backend.

adc_flavors:
  radix17:
    cdac_weights: [768, 512, 320, 192, 96, 64, 32, 24, 12, 10, 5, 4, 4, 2, 1, 1]
  radix20:
    cdac_weights: [768, 512, 320, 192, 128, 64, 64, 64, 64, 64, 32, 16, 8, 4, 2, 1]

boards:
  "00":
    # SPI / comparator-mux index to physical CDAC flavor.
    adc_channels:
      0: radix17
      1: radix20
      2: radix17
      3: radix20
      4: radix17
      5: radix20
      6: radix17
      7: radix20
      8: radix17
      9: radix20
      10: radix17
      11: radix20
      12: radix17
      13: radix20
      14: radix17
      15: radix20

    # VDD_IO is not connected to one of the three programmable Keithley rails.
    fixed_vdd_io_v: 1.2

    supply_limits:
      maximum_voltage_v: 1.2
      loaded_voltage_tolerance_v: 0.05
      smu_voltage_range_v: 2.0
      smu_current_compliance_a: 0.0005
      vin_cm_current_limit_a: 0.01

    # Empirical instrument-to-ADC calibration measured on 2026-07-22 at the
    # connected ADC input. Validated for |Vdiff| <= 1 V and
    # 0.4 V <= Vin_cm <= 0.8 V. Positive AWG voltage produces negative Vdiff.
    input_calibration:
      maximum_abs_vdiff_v: 1.0
      minimum_vin_cm_v: 0.4
      maximum_vin_cm_v: 0.8
      awg_calibration_vin_cm_v: 0.6
      awg_vdiff_magnitude_coefficients:
        - 2.265447848881228
        - -0.3005942675774198
        - 0.20746371783097167
        - -0.13495070088311512
        - -0.08153988321949701
        - 0.1537466159659059
      awg_center_coefficients:
        - -0.03749354410501951
        - 0.0464882208329994
        - -0.022513114873877624
        - -0.025158294762495398
        - 0.00015199446637113683
        - -0.08383413425431123
      vin_cm_supply_offset_v: -0.014316241071428943
      vin_cm_supply_gain: 0.9985304375000002

    # Analytical COMP_OUT capture model. FPGA delays and clock skew come from
    # the routed KX1 timing report. The external bounds cover the 3.649--6.764
    # ns COMP-to-COMP_OUT delays observed across 669 transitions on 2026-07-30.
    # Setup is calculated from the latest current decision and hold from the
    # earliest following decision. All four ADC control lanes may move earlier
    # together, preserving every relative timing interval while moving the
    # returned decisions away from a FastRX clock boundary.
    capture_timing_model:
      seqgen_pipeline_cycles: 1.0
      oserdes_to_output_s: 2.004e-9
      external_comp_delay_min_s: 3.5e-9
      external_comp_delay_max_s: 6.9e-9
      comp_input_to_fastrx_d_s: 5.740e-9
      # Routed serializer-clock insertion is 10.216 ns; FastRX capture-clock
      # insertion is 8.661 ns, giving 1.555 ns of launch-to-capture skew.
      launch_to_capture_clock_skew_s: 1.555e-9
      idelay_tap_s: 78.125e-12
      idelay_tap_count: 32
      # Use up to five setup-side taps while retaining the modeled hold margin.
      # At 1.52 GBd, repeated 200k-conversion sine captures were clean at taps
      # 18/20 but contained rare gross errors at taps 22/24.
      idelay_setup_backoff_taps: 5
      maximum_control_phase_advance_symbols: 7
      minimum_capture_margin_s: 0.5e-9
