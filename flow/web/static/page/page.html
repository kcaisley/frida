<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* one laid-out instance (flow/web/page.py): a header, the views as tabs, the layers' dock under the
   layout views; a CAD tool's look, dark first, on the viewer's Nord colours */
:root {
  --bg: #f4f5f8; --panel: #ffffff; --scene: #eceff4; --line: #d8dde6; --fg: #2e3440; --muted: #5d6676;
  --accent: #3b6ea8; --good: #4c7a3a; --bad: #b0414c; --none: #8a93a3; --code: #f8f9fb; --ink: #2e3440; --warn: #946200;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1f27; --panel: #232832; --scene: #20242c; --line: #3b4252; --fg: #e5e9f0; --muted: #a3adbf;
    --accent: #88c0d0; --good: #a3be8c; --bad: #d57780; --none: #6c7689; --code: #1e222a; --ink: #d8dee9; --warn: #ebcb8b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1f27; --panel: #232832; --scene: #20242c; --line: #3b4252; --fg: #e5e9f0; --muted: #a3adbf;
  --accent: #88c0d0; --good: #a3be8c; --bad: #d57780; --none: #6c7689; --code: #1e222a; --ink: #d8dee9; --warn: #ebcb8b; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
/* no text inflation: iOS WebKit enlarges text in a block it finds too wide (a table's long lines) */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); overflow: hidden; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav { border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: 2px; min-width: max-content; }
.tabs button { font: 500 13px/1 var(--sans); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px 9px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { position: relative; min-height: 0; }
.view { position: absolute; inset: 0; }
.scroll { overflow: auto; }

/* metrics: the pipeline's steps in order, each one table (a row a fact, a column an instance) */
.metrics { padding-block: 16px 32px; display: grid; gap: 14px; align-content: start; max-width: 980px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 8px; display: grid; gap: 8px; min-width: 0; }
.card h2 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h2 .n { font: 500 11px var(--mono); color: var(--muted); }
.table { overflow-x: auto; }
table { border-collapse: collapse; font: 12px/1.35 var(--mono); }
table.step { width: 100%; table-layout: fixed; }
table.step col.label { width: 42%; }
th, td { padding: 4px 12px 4px 0; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font: 500 12px var(--mono); color: var(--muted); }
tbody th { font: 400 12px/1.35 var(--sans); color: var(--muted); overflow-wrap: anywhere; }
td.num { font-variant-numeric: tabular-nums; }
td.text { overflow-wrap: anywhere; }
tr.group th { padding-top: 12px; font: 500 11px var(--sans); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border-bottom-color: var(--line); }
tr:last-child th, tr:last-child td { border-bottom: 0; }
tr.differ td { color: var(--bad); }
.state { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.state.ok { color: var(--good); } .state.warn { color: var(--warn); } .state.bad { color: var(--bad); }
.more { font: 12px var(--sans); color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer; }

/* netlist */
.code { margin: 0; padding-block: 12px 24px; font: 12px/1.55 var(--mono); background: var(--code); min-height: 100%; box-sizing: border-box; tab-size: 4; }
.code .ln { display: inline-block; width: 4ch; margin-right: 2ch; text-align: right; color: var(--none); user-select: none; }
.code .c { color: var(--muted); font-style: italic; } .code .k { color: var(--accent); } .code .i { color: var(--good); } .code .p { color: var(--muted); }
.corner { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; z-index: 2; }
.corner button, .tools button { font: 500 12px/1 var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; white-space: nowrap; }
.corner button:hover, .tools button:hover { border-color: var(--accent); }
.tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

/* schematic: the Circuitikz skin's drawing on the sheet, in the theme's ink (the viewer's treatment) */
.sheet { background: var(--scene); overflow: hidden; touch-action: none; cursor: grab; }
.sheet .paper { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.sheet .paper svg { display: block; }
#paper svg > rect:first-of-type { fill: none; stroke: none; }
#paper svg [fill="white"], #paper svg [fill="#fff"], #paper svg .gatebubble { fill: var(--scene); }
#paper svg, #paper svg path, #paper svg circle, #paper svg rect, #paper svg line, #paper svg polyline { stroke: var(--ink); }
#paper svg text { fill: var(--ink); stroke: none; }
#paper svg [fill="black"], #paper svg [fill="#000"], #paper svg .splitjoinBody { fill: var(--ink); }
.empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: var(--muted); text-align: center; }

/* layout views */
.stage { background: var(--scene); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.readout { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; font: 11px/1.3 var(--mono); color: var(--muted); pointer-events: none; }
.dock { padding-block: 8px 10px; border-top: 1px solid var(--line); display: grid; gap: 8px; background: var(--panel); }
.layers { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.layers::-webkit-scrollbar { display: none; }
.layers button { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; cursor: pointer; flex: none; }
.layers button .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.layers button[aria-pressed="false"] { color: var(--muted); background: transparent; }
.layers button[aria-pressed="false"] .sw { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.tools .sep { width: 1px; height: 20px; background: var(--line); }
label.z { display: inline-flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted); }
label.z input { width: 110px; accent-color: var(--accent); }
@media (max-width: 560px) { .tabs button { padding-inline: 9px; } }
</style>

<div class="app">
  <nav class="pad"><div class="tabs" role="tablist" id="tabs"></div></nav>
  <main id="main">
    <section class="view scroll" id="view-metrics" role="tabpanel"><div class="metrics pad" id="metrics"></div></section>
    <section class="view scroll" id="view-netlist" role="tabpanel" hidden>
      <div class="corner"><button type="button" id="copy">Copy</button></div>
      <pre class="code pad" id="code"></pre>
    </section>
    <section class="view sheet" id="view-schematic" role="tabpanel" hidden>
      <div class="corner"><button type="button" id="sfit">Fit</button></div>
      <div class="paper" id="paper"></div>
    </section>
    <section class="view stage" id="view-2d" role="tabpanel" hidden>
      <div class="corner"><button type="button" id="fit2">Fit</button><button type="button" id="labels" aria-pressed="false">Labels</button></div>
      <canvas id="canvas2"></canvas>
      <div class="readout" id="readout2"></div>
    </section>
    <section class="view stage" id="view-3d" role="tabpanel" hidden>
      <div class="corner"><button type="button" id="home">Home</button><button type="button" id="top">Top</button></div>
      <div class="readout" id="readout3">drag: orbit · right-drag / two fingers: pan · wheel / pinch: zoom</div>
    </section>
  </main>
  <div class="dock pad" id="dock" hidden>
    <div class="layers" id="layers" role="group" aria-label="Layers"></div>
    <div class="tools">
      <button type="button" id="all">All layers</button>
      <span class="sep" data-3d></span>
      <button type="button" id="xray" aria-pressed="false" data-3d>X-ray</button>
      <button type="button" id="edges" aria-pressed="true" data-3d>Edges</button>
      <label class="z" for="zscale" data-3d>z × <input id="zscale" type="range" min="1" max="8" step="0.5" value="2"><span id="zval">2</span></label>
    </div>
  </div>
</div>

<script id="page" type="application/json">/*PAGE*/{}</script>
<script id="layout" type="application/json">/*LAYOUT*/null</script>
<script id="netlist" type="application/json">/*NETLIST*/""</script>
<script id="schematic" type="application/json">/*SCHEMATIC*/""</script>
<script type="module">
/*SCRIPT*/
</script>
