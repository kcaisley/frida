<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Explorer</title>
    <script>
        // the old instance and compare pages are states of the one page now: an instance
        // (?block=&id=) or several (?block=&ids=a,b) opened in place, by the URL's hash
        (() => {
            const query = new URLSearchParams(location.search);
            const ids = (query.get("ids") || query.get("id") || "").split(",").filter(Boolean);
            const parts = [];
            if (query.get("block")) parts.push(`block=${encodeURIComponent(query.get("block"))}`);
            if (ids.length) parts.push(`ids=${ids.map(encodeURIComponent).join(",")}`);
            location.replace(`index.html#${parts.join("&")}`);
        })();
    </script>
</head>
<body>
    <p><a href="index.html">The viewer</a></p>
</body>
</html>
