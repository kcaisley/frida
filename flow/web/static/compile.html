<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Compiler</title>
    <script>
        // the Compiler is a state of the one page now (index.html#compiler&job=<id>)
        (() => {
            const job = new URLSearchParams(location.search).get("job");
            location.replace(`index.html#compiler${job ? `&job=${encodeURIComponent(job)}` : ""}`);
        })();
    </script>
</head>
<body>
    <p><a href="index.html#compiler">The Compiler</a></p>
</body>
</html>
